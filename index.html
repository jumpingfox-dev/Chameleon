<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chameleon</title>
</head>
<style>
    body {
        font-family: Verdana, sans-serif;
        background-color: #312F3A;
    }

    h1 {
        font-weight: 600;
        text-align: center;
        color: #F5F7FA;
        padding: 10px 0px;
    }

    p {
        text-align: center;
        color: #F5F7FA;
        padding: 10px 250px;
    }

    form {
        display: block;
        width: 125px;
        margin: 0 auto;
    }

    .fit {
        max-width: 10%;
        max-height: 10%;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
</style>
<body>
    <h1>Chameleon</h1>

    <hr><br>

    <img class="fit" src="logo.png" alt="Logo">

    <p>
        Chameleon is a deeply customizable Jellyfin client built on top of Flutter.
    </p>

    <form action="privacy">
        <input type="submit" value="Privacy Policy" />
    </form>
</body>
</html>
